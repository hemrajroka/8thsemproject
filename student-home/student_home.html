<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Home - Recommended Colleges</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      display: flex;
    }

    .sidebar {
      width: 220px;
      background-color: #1c3a66;
      height: 100vh;
      padding-top: 1rem;
      position: fixed;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      z-index: 100;
    }

    .sidebar a {
      text-decoration: none;
      color: #f7b733;
      font-weight: 500;
      padding: 0.75rem 1rem;
      display: block;
      transition: background 0.2s ease;
    }

    .sidebar a:hover {
      background-color: #274c87;
    }

    header {
      position: fixed;
      top: 0;
      left: 220px;
      right: 0;
      height: 48px;
      background-color: #1c3a66;
      color: #f7b733;
      padding: 0.6rem 1rem;
      font-size: 1.3rem;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      z-index: 101;
    }

    main {
      margin-left: 220px;
      padding: 2rem;
      padding-top: calc(48px + 2rem);
      width: calc(100% - 220px);
      max-width: 1200px;
      box-sizing: border-box;
    }

    h2 {
      color: #274c87;
      margin-bottom: 1rem;
      text-align: center;
    }

    .grid-table {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    .college-card {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .college-card:hover {
      box-shadow: 0 8px 15px rgba(247, 183, 51, 0.4);
    }

    .college-card h3 {
      margin: 0 0 0.6rem 0;
      color: #1c3a66;
      font-size: 1.2rem;
    }

    .college-info-label {
      font-weight: 600;
      color: #274c87;
    }

    .college-info-value {
      margin-left: 4px;
      font-weight: 400;
      color: #333;
    }

    .actions {
      margin-top: auto;
      display: flex;
      gap: 0.6rem;
      justify-content: center;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .view-btn {
      background-color: #1c3a66;
      color: #fff;
    }

    .view-btn:hover {
      background-color: #274c87;
    }

    .apply-btn {
      background-color: #f7b733;
      color: #1c3a66;
    }

    .apply-btn:hover {
      background-color: #e6a600;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 180px;
      }

      header {
        left: 180px;
      }

      main {
        margin-left: 180px;
        padding: 1rem;
      }

      .grid-table {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <a href="/6thsem_project/student-home/applications.php">Application Status</a>
    <a href="/6thsem_project/student-home/view_all_colleges.php">All colleges</a>
    <a href="/6thsem_project/student-home/view_other_universities.php">Universities</a>
    <a href="/6thsem_project/student-home/profile_update.php">Profile</a>
    <a href="/6thsem_project/login/login.html">Logout</a>
  </div>

  <header>
    <h1>Student Portal</h1>
  </header>

  <main>
    <div class="grid-table" id="college-list">
      <p>Loading recommendations...</p>
    </div>
  </main>

  <script>
    function viewDetails(collegeId) {
      window.location.href = `/6thsem_project/student-home/view_college_details.php?id=${collegeId}`;
    }

    function applyForCollege(collegeId) {
      window.location.href = `/6thsem_project/student-home/apply_college.php?college_id=${collegeId}`;
    }

    document.addEventListener("DOMContentLoaded", function () {
      const container = document.getElementById("college-list");

      function fetchRecommendations() {
        container.innerHTML = "<p>Loading recommendations...</p>";

        fetch('/6thsem_project/student-home/recommend_colleges.php')
          .then(response => {
            if (!response.ok) throw new Error("Network response was not ok");
            return response.json();
          })
          .then(data => {
            if (data.length > 0) {
              container.innerHTML = ''; // clear loading

              data.forEach(college => {
                const card = document.createElement("div");
                card.className = "college-card";

                card.innerHTML = `
                  <h3>${college.name}</h3>
                  <div><span class="college-info-label">Course:</span><span class="college-info-value">${college.course}</span></div>
                  <div><span class="college-info-label">University:</span><span class="college-info-value">${college.university}</span></div>
                  <div><span class="college-info-label">Location:</span><span class="college-info-value">${college.location}</span></div>
                  <div><span class="college-info-label">Phone:</span><span class="college-info-value">${college.phone_number}</span></div>
                  <div><span class="college-info-label">Scholarships:</span><span class="college-info-value">${college.scholarships}</span></div>
                  <div><span class="college-info-label">Duration:</span><span class="college-info-value">${college.duration}</span></div>
                  <div><span class="college-info-label">Match:</span><span class="college-info-value">${(college.similarity * 100).toFixed(1)}%</span></div>
                  <div class="actions">
                    <button class="view-btn" onclick="viewDetails(${college.id})">View Details</button>
                    <button class="apply-btn" onclick="applyForCollege(${college.id})">Apply Now</button>
                  </div>
                `;

                container.appendChild(card);
              });
            } else {
              container.innerHTML = "<p>No recommended colleges found.</p>";
            }
          })
          .catch(error => {
            container.innerHTML = "Error loading data: " + error.message;
          });
      }

      fetchRecommendations();
    });
  </script>

</body>
</html>
